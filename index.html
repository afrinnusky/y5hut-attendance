
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>y5 HuT Attendance</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f2;
  color: #17251c;
}

header {
  background: #075b35;
  color: white;
  padding: 25px 15px;
  text-align: center;
}

header h1 { margin: 0; font-size: 36px; }

main {
  max-width: 430px;
  margin: 30px auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 3px 15px #0001;
}

h2 { text-align: center; }

input, select, button {
  width: 100%;
  padding: 14px;
  margin: 9px 0;
  border-radius: 9px;
  font-size: 16px;
}

input, select {
  border: 1px solid #ccc;
  background: white;
}

button {
  background: #087b45;
  color: white;
  border: 0;
  font-weight: bold;
  cursor: pointer;
}

.secondary { background: #64746a; }

.note {
  text-align: center;
  color: #65736a;
  font-size: 13px;
}

.hidden { display: none; }

</style>
</head>

<body>

<header>
  <h1>y5 HuT</h1>
  <p>Staff Attendance Management</p>
</header>

<main>

<!-- LOGIN -->
<div class="card" id="loginPage">

<h2>Employee Login</h2>

<input id="loginUsername"
type="text" placeholder="Username">

<input id="loginPassword"
type="password" placeholder="Password">

<button onclick="login()">Login</button>

<p class="note">New Employee?</p>

<button onclick="showRegister()">
Create Account
</button>

<p class="note">
Account requires Admin Approval.
</p>

</div>

<!-- REGISTRATION -->
<div class="card hidden" id="registerPage">

<h2>Employee Registration</h2>

<input id="empName"
type="text" placeholder="Employee Full Name">

<input id="empID"
type="text" placeholder="Employee ID">

<input id="empUsername"
type="text" placeholder="Create Username">

<input id="empPassword"
type="password" placeholder="Create Password">

<input id="empMobile"
type="tel" placeholder="Mobile Number">

<select id="empBranch">
<option value="">Select Branch</option>
<option>Main</option>
<option>AKP</option>
<option>Pottuvil</option>
<option>Apple HuT</option>
<option>Talk Town</option>
<option>Distribution</option>
</select>

<select id="empDepartment">
<option value="">Select Department</option>
<option>Sales</option>
<option>Service</option>
<option>Accounts</option>
<option>Stock</option>
<option>Management</option>
<option>Other</option>
</select>

<select id="empDesignation">
<option value="">Select Designation</option>
<option>Manager</option>
<option>Supervisor</option>
<option>Sales Executive</option>
<option>Cashier</option>
<option>Technician</option>
<option>Store Keeper</option>
<option>Other</option>
</select>

<button onclick="registerEmployee()">
Submit Registration
</button>

<button class="secondary"
onclick="showLogin()">
Back to Login
</button>

<p class="note">
Registration requires Main Admin Approval.
</p>

</div>

</main>

<script>

function showRegister() {
  document.getElementById("loginPage")
  .classList.add("hidden");

  document.getElementById("registerPage")
  .classList.remove("hidden");
}

function showLogin() {
  document.getElementById("registerPage")
  .classList.add("hidden");

  document.getElementById("loginPage")
  .classList.remove("hidden");
}

function registerEmployee() {

  const fields = [
    "empName",
    "empID",
    "empUsername",
    "empPassword",
    "empMobile",
    "empBranch",
    "empDepartment",
    "empDesignation"
  ];

  for (const field of fields) {
    if (!document.getElementById(field).value.trim()) {
      alert("Please fill all details.");
      return;
    }
  }

  const password =
    document.getElementById("empPassword").value;

  if (password.length < 6) {
    alert("Password must be at least 6 characters.");
    return;
  }

  alert(
    "Registration form completed!\n\n" +
    "Database connection is required to save your application."
  );
}

function login() {
  alert("Login system requires Firebase connection.");
}

</script>

</body>
</html>
