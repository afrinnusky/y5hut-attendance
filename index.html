
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>y5 HuT Attendance</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f2;
  color: #17251c;
}

header {
  background: #075b35;
  color: white;
  padding: 25px 15px;
  text-align: center;
}

header h1 { margin: 0; font-size: 38px; }

main {
  max-width: 430px;
  margin: 35px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 3px 15px #0001;
}

h2 { text-align: center; }

input, select, button {
  width: 100%;
  padding: 14px;
  margin: 10px 0;
  border-radius: 9px;
  font-size: 16px;
}

input, select { border: 1px solid #ccc; }

button {
  background: #087b45;
  color: white;
  border: 0;
  font-weight: bold;
  cursor: pointer;
}

.secondary {
  background: #64746a;
}

.note {
  text-align: center;
  color: #65736a;
  font-size: 13px;
}

.hidden { display: none; }
</style>
</head>

<body>

<header>
  <h1>y5 HuT</h1>
  <p>Staff Attendance Management</p>
</header>

<main>

<!-- LOGIN PAGE -->
<div class="card" id="loginPage">

<h2>Employee Login</h2>

<input type="text" id="loginUsername"
placeholder="Username">

<input type="password" id="loginPassword"
placeholder="Password">

<button onclick="login()">Login</button>

<p class="note">New Employee?</p>

<button onclick="showRegister()">
Create Account
</button>

<p class="note">
Account requires Admin Approval.
</p>

</div>

<!-- REGISTRATION PAGE -->
<div class="card hidden" id="registerPage">

<h2>Employee Registration</h2>

<input type="text" id="empName"
placeholder="Employee Full Name">

<input type="text" id="empUsername"
placeholder="Create Username">

<input type="password" id="empPassword"
placeholder="Create Password">

<input type="tel" id="empMobile"
placeholder="Mobile Number">

<select id="empBranch">
<option value="">Select Branch</option>
<option>Main</option>
<option>AKP</option>
<option>Pottuvil</option>
<option>Apple HuT</option>
<option>Talk Town</option>
</select>

<button onclick="registerEmployee()">
Submit Registration
</button>

<button class="secondary"
onclick="showLogin()">
Back to Login
</button>

<p class="note">
Your account requires Admin Approval.
</p>

</div>

</main>

<script>

function showRegister() {
  document.getElementById("loginPage")
  .classList.add("hidden");

  document.getElementById("registerPage")
  .classList.remove("hidden");
}

function showLogin() {
  document.getElementById("registerPage")
  .classList.add("hidden");

  document.getElementById("loginPage")
  .classList.remove("hidden");
}

function registerEmployee() {

  const name = document.getElementById("empName").value.trim();
  const username = document.getElementById("empUsername").value.trim();
  const password = document.getElementById("empPassword").value;
  const mobile = document.getElementById("empMobile").value.trim();
  const branch = document.getElementById("empBranch").value;

  if (!name || !username || !password || !mobile || !branch) {
    alert("Please fill all details.");
    return;
  }

  if (password.length < 6) {
    alert("Password must be at least 6 characters.");
    return;
  }

  alert("Registration form completed! Database connection is required to submit your application.");

}

function login() {
  alert("Login system will be connected with Firebase.");
}

</script>

</body>
</html>
